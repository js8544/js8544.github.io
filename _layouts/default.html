<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
<header>
<nav>{% unless page.url == '/' %}<a href="/">Jin Shang</a> · <a href="/blog/">{% include t.html en="Writing" zh="文章" %}</a> · <a href="/publications/">{% include t.html en="Publications" zh="论文" %}</a>{% endunless %}</nav>
<span class="switches" hidden>
<button type="button" id="lang-switch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg></button>
<button type="button" id="theme-switch"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2.500M12 19v2.500M2.500 12H5M19 12h2.500M5.300 5.300 7 7M17 17l1.700 1.700M18.700 5.300 17 7M7 17l-1.700 1.700"/></svg></button>
</span>
</header>
<main>
{{ content }}
</main>
{% include footer.html %}
<script>
(function () {
  var d = document.documentElement;
  var langBtn = document.getElementById('lang-switch');
  var themeBtn = document.getElementById('theme-switch');
  function theme() {
    return d.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function label() {
    var zh = d.getAttribute('data-ui') === 'zh';
    var dark = theme() === 'dark';
    d.setAttribute('data-shown-theme', dark ? 'dark' : 'light');
    var l = zh ? 'Switch to English' : '切换到中文';
    var t = dark ? (zh ? '切换到浅色' : 'Switch to light') : (zh ? '切换到深色' : 'Switch to dark');
    langBtn.title = l; langBtn.setAttribute('aria-label', l);
    themeBtn.title = t; themeBtn.setAttribute('aria-label', t);
  }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  langBtn.onclick = function () {
    var next = d.getAttribute('data-ui') === 'zh' ? 'en' : 'zh';
    d.setAttribute('data-ui', next); save('ui-lang', next); label();
  };
  themeBtn.onclick = function () {
    var next = theme() === 'dark' ? 'light' : 'dark';
    d.setAttribute('data-theme', next); save('theme', next); label();
  };
  label();
  document.querySelector('.switches').hidden = false;
})();
</script>
</body>
</html>
