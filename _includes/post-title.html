{% assign p = include.post %}{% assign pl = p.lang | default: 'en' %}{% if p.title_translated %}{% if pl == 'zh' %}<span data-l="zh" lang="zh">{{ p.title }}</span><span data-l="en">{{ p.title_translated }}</span>{% else %}<span data-l="en">{{ p.title }}</span><span data-l="zh" lang="zh">{{ p.title_translated }}</span>{% endif %}{% else %}<span{% if p.lang %} lang="{{ p.lang }}"{% endif %}>{{ p.title }}</span>{% endif %}
