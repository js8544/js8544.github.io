<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% capture page_desc %}{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}{% endcapture %}
<title>{% if page.title %}{{ page.title }} - {{ site.owner.name }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page_desc | escape }}">
<meta name="author" content="{{ site.owner.name }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | prepend: site.url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.url }}/feed.xml">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page_desc | escape }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | prepend: site.url }}">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/main.css">
{% if page.mathjax %}
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]'],['$$','$$']]}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{% endif %}
