<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="/" aria-label="{{ site.owner.name }}, home">
      <span class="seal" aria-hidden="true">尚晋</span>
      <span class="brand__name">Jin Shang</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {% for link in site.data.navigation %}
      <a href="{{ link.url }}"{% if page.url contains link.url and link.url != '/' %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
      <a class="icon-btn" href="/search/" aria-label="Search"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg></a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch between light and dark"><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>
    </nav>
  </div>
</header>
